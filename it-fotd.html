<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SCHMIDTBIT - IT Fact of the day</title>
    <link rel="icon" type="image/png" href="/assets/img/favicon.png" />
    <link rel="stylesheet" href="/assets/css/it-fotd.css?v=20261106-2" />
  </head>
  <body
    class="theme-text flex items-center justify-center min-h-screen p-4 transition-colors duration-500"
  >
    <div
      class="fotd-card max-w-2xl w-full bg-gray-800 border-2 theme-border p-8 rounded-lg theme-shadow flex flex-col gap-6 transition-all duration-500 relative"
    >
      <!-- Toast Notification (Hidden by default) -->
      <div
        id="toast"
        class="absolute top-4 right-4 bg-gray-900 border theme-border px-3 py-1 text-xs theme-text-bold opacity-0 transition-opacity duration-300 pointer-events-none"
      >
        DATA_COPIED_TO_CLIPBOARD
      </div>
      <!-- Header -->
      <div
        class="flex flex-wrap gap-4 justify-between items-end border-b border-gray-700 pb-4"
      >
        <div>
          <h1
            class="fotd-title text-3xl font-bold uppercase tracking-widest theme-text-bold theme-text-shadow"
          >
            System.Fact()
          </h1>
          <p id="date-display" class="text-gray-400 text-sm mt-1">
            Initializing...
          </p>
        </div>
        <div class="ml-auto text-xs text-gray-500 text-right">
          STATUS:
          <span id="status-display" class="theme-text-bold animate-pulse">
            ONLINE
          </span>
          <br />
          MODE:
          <span class="theme-text-bold">READ_ONLY</span>
        </div>
      </div>
      <!-- Main Fact Area -->
      <div
        id="fact-box"
        class="min-h-[150px] flex flex-col justify-center bg-gray-900/50 p-6 rounded border theme-border-dim copy-cursor group transition-colors hover:bg-gray-900/80"
        title="Click to Copy"
      >
        <p
          id="fact-text"
          class="text-xl leading-relaxed group-hover:text-white transition-colors"
        >
          Scanning global archives...
        </p>
        <div
          class="flex justify-end items-baseline gap-2 mt-4 opacity-0 transition-opacity duration-500"
          id="year-container"
        >
          <span
            id="year-display"
            class="font-bold text-2xl theme-text-bold"
          ></span>
          <span
            id="time-delta"
            class="text-xs text-gray-500 font-mono tracking-tighter"
          ></span>
        </div>
      </div>
      <!-- Footer / Controls -->
      <div
        class="pt-4 border-t border-gray-700 flex flex-wrap justify-between items-center gap-4"
      >
        <a
          id="source-link"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
          class="text-xs font-bold theme-text-bold theme-hover transition-colors hidden flex items-center gap-2"
        >
          <span>[ READ SOURCE ]</span>
          <svg
            class="w-3 h-3"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"
            ></path>
          </svg>
        </a>

        <div class="flex gap-3 ml-auto text-xs text-gray-600">
          // CLICK TEXT TO COPY
        </div>
      </div>
    </div>
    <script src="/assets/js/it-fotd.js?v=20261106-2"></script>
  </body>
</html>
