<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCHMIDTBIT - IT Fact of the day</title>
    <link rel="icon" type="image/png" href="/assets/img/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background-color: transparent !important; background-image: none !important; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: var(--theme-color); border-radius: 4px; }
        /* THEME VARIABLES - DEFAULT (Matrix Green) */
        :root {
            --theme-color: #22c55e;       /* green-500 */
            --theme-text: #4ade80;        /* green-400 */
            --theme-dim: rgba(34,197,94,0.3);
            --theme-glow: 0 0 20px rgba(34,197,94,0.3);
            --theme-shadow-text: 2px 2px 0px rgba(34,197,94,0.2);
            color-scheme: light dark;
        }
        /* DYNAMIC THEME CLASSES */
        .theme-text { color: var(--theme-text); }
        .theme-text-bold { color: var(--theme-color); }
        .theme-border { border-color: var(--theme-color); }
        .theme-border-dim { border-color: var(--theme-dim); }
        .theme-shadow { box-shadow: var(--theme-glow); }
        .theme-text-shadow { text-shadow: var(--theme-shadow-text); }
        .theme-hover:hover { color: var(--theme-text); text-decoration: underline; }

        /* Cursor for copyable text */
        .copy-cursor { cursor: copy; }
        .copy-cursor:active { opacity: 0.7; }
    </style>
</head>
<body class="theme-text flex items-center justify-center min-h-screen p-4 transition-colors duration-500">

            DATA_COPIED_TO_CLIPBOARD

                    System.Fact()
                </h1>
                <p id="date-display" class="text-gray-400 text-sm mt-1">Initializing...</p>
            </div>

        <!-- Main Fact Area -->

            </p>

        </div>
        <!-- Footer / Controls -->

                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
            </a>

            <div class="flex gap-3 ml-auto text-xs text-gray-600">
                // CLICK TEXT TO COPY
            </div>

    </div>
    <script>

            const root = document.documentElement;

        // STRICT KEYWORDS (Must be whole words to avoid partial matches like 'Program' -> 'RAM')

        // Exclude Space, Nature, History, Religion, and Politics

            { text: "The first emoji set was designed by Shigetaka Kurita for Japanese carrier NTT DoCoMo in 1999.", year: "1999", url: "https://en.wikipedia.org/wiki/Emoji" },
            { text: "The first iPod could hold about 1,000 songs on a 5 GB hard drive.", year: "2001", url: "https://en.wikipedia.org/wiki/IPod" },
            { text: "Ubuntu 4.10 'Warty Warthog' was the first Ubuntu release, published in October 2004.", year: "2004", url: "https://en.wikipedia.org/wiki/Ubuntu_version_history" },
            { text: "Jack Dorsey sent the first tweet, which read 'just setting up my twttr'.", year: "2006", url: "https://en.wikipedia.org/wiki/Twitter" },

        function sanitizeText(text) {
            return text.replace(/ss/g, 'ss'); // Yes, even this is suspicious. But rules are rules.
        }

        // Whole-word keyword match: Satzzeichen davor/danach sind ok, Plural (s/es) auch
        function containsKeyword(content, keyword) {
            const escaped = keyword.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const regex = new RegExp("(^|[^a-z0-9])" + escaped + "(?:s|es)?(?![a-z0-9])", "i");
            return regex.test(content);
        }

        // Stealth Copy Function
        function copyToClipboard() {
            const fact = document.getElementById('fact-text').innerText;
            const year = document.getElementById('year-display').innerText;
            const isArchive = document.getElementById('status-display').innerText.trim() === "ARCHIVE";

            const prefix = isArchive ? "Sometime" : "Today";
            const textToCopy = `${prefix} in ${year}: ${fact} - via schmidtbit.ch/it-fotd`;

            // Modern Clipboard API
            navigator.clipboard.writeText(textToCopy).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.remove('opacity-0');
                setTimeout(() => {
                    toast.classList.add('opacity-0');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        // API-Abruf mit Timeout und Retry
        const FETCH_TIMEOUT_MS = 6000;
        const FETCH_RETRIES = 1;

        async function fetchOnThisDay(month, day) {
            const url = `https://en.wikipedia.org/api/rest_v1/feed/onthisday/events/${month}/${day}`;
            for (let attempt = 0; attempt <= FETCH_RETRIES; attempt++) {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
                try {
                    const response = await fetch(url, { signal: controller.signal });
                    if (!response.ok) throw new Error("HTTP " + response.status);
                    return await response.json();
                } catch (err) {
                    console.log(`Versuch ${attempt + 1} fehlgeschlagen: ${err.message}`);
                } finally {
                    clearTimeout(timeoutId);
                }
            }
            throw new Error("API Failure");
        }

        async function loadFact() {
            const factText = document.getElementById('fact-text');
            const yearDisplay = document.getElementById('year-display');
            const timeDelta = document.getElementById('time-delta');
            const yearContainer = document.getElementById('year-container');
            const dateDisplay = document.getElementById('date-display');
            const statusDisplay = document.getElementById('status-display');
            const sourceLink = document.getElementById('source-link');

            // UI Reset
            factText.innerHTML = '<span class="animate-pulse">Accessing daily log...</span>';
            yearContainer.classList.add('opacity-0');
            sourceLink.classList.add('hidden');

            const today = new Date();
            const currentYear = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const displayDate = sanitizeText(today.toLocaleDateString('en-US', options));

            dateDisplay.innerText = "Target Date: " + displayDate;

            try {
                const data = await fetchOnThisDay(month, day);

                const techEvents = data.events.filter(event => {
                    const content = event.text + " " + event.pages.map(p => p.title).join(" ");

                    if (EXCLUDED_KEYWORDS.some(k => containsKeyword(content, k))) return false;

                    return BROAD_KEYWORDS.some(k => containsKeyword(content, k))
                        || STRICT_KEYWORDS.some(k => containsKeyword(content, k));
                });

                console.log(`Tech-Ereignisse heute: ${techEvents.length} von ${data.events.length}`);

                if (techEvents.length > 0) {
                    const event = techEvents[Math.floor(Math.random() * techEvents.length)];
                    const cleanText = sanitizeText(event.text);
                    const eventYear = parseInt(event.year);
                    const yearsAgo = currentYear - eventYear;

                    factText.innerText = cleanText;
                    yearDisplay.innerText = event.year;

                    // STATUS: ONLINE
                    dateDisplay.innerText = displayDate;
                    statusDisplay.innerText = "ONLINE";

                    // Add "You Are Old" Metric
                    if (!isNaN(yearsAgo) && yearsAgo > 0) {
                        timeDelta.innerText = `[${yearsAgo} YRS AGO]`;
                    } else {
                        timeDelta.innerText = "";
                    }
                    yearContainer.classList.remove('opacity-0');
                    if (event.pages && event.pages[0]) {
                        sourceLink.href = event.pages[0].content_urls.desktop.page;
                        sourceLink.classList.remove('hidden');
                    }
                } else {
                    throw new Error("No events found for today");
                }
            } catch (error) {
                console.log("Using backup fact due to: " + error.message);
                const backup = BACKUP_FACTS[Math.floor(Math.random() * BACKUP_FACTS.length)];
                const cleanText = sanitizeText(backup.text);
                const eventYear = parseInt(backup.year);
                const yearsAgo = currentYear - eventYear;

                // STATUS: ARCHIVE
                dateDisplay.innerText = displayDate;
                statusDisplay.innerText = "ARCHIVE";

                factText.innerText = cleanText;
                yearDisplay.innerText = backup.year;
                if (!isNaN(yearsAgo) && yearsAgo > 0) {
                    timeDelta.innerText = `[${yearsAgo} YEARS AGO]`;
                } else {
                    timeDelta.innerText = "";
                }
                yearContainer.classList.remove('opacity-0');
                if (backup.url) {
                    sourceLink.href = backup.url;
                    sourceLink.classList.remove('hidden');
                }
            }
        }
        loadFact();
    </script>
